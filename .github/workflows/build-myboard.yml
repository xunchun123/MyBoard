# MyBoard 云打包 + 云真机冒烟测试
# 打包 arm64（真机）+ x86_64（云模拟器），打完自动在云模拟器里启动验崩溃
# 手动触发：Actions → Build MyBoard debug APK → Run workflow
name: Build MyBoard debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      BUILD_ABI: arm64-v8a,x86_64
    steps:
      - name: Checkout (no submodules yet)
        uses: actions/checkout@v6
        with:
          submodules: false
          fetch-depth: 1

      - name: Checkout needed submodules only (拼音+英文所需，笔画/注音/仓颉已删)
        run: |
          git submodule update --init --recursive --depth 1 \
            app/data/rime/prelude \
            app/data/rime/luna-pinyin \
            app/data/rime/essay \
            app/src/main/jni/librime \
            app/src/main/jni/OpenCC \
            app/src/main/jni/snappy \
            app/src/main/jni/librime-lua \
            app/src/main/jni/librime-lua-deps \
            app/src/main/jni/librime-octagram \
            app/src/main/jni/librime-predict

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install CMake + NDK (用机器自带的SDK)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --install "cmake;3.31.6" "ndk;28.0.13004108"

      - name: Build debug APK
        run: make debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyBoard-debug-apks
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish to Releases (直接下.apk用)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: myboard-latest
          name: MyBoard 最新测试包
          body: 自动打包的测试版，下载 .apk 发到手机安装即可。
          files: app/build/outputs/apk/debug/*.apk

  # 云模拟器冒烟测试：装x86_64包 → 启动主界面 → 截图 + 抓崩溃日志，全程不用碰手机
  smoke-test:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: MyBoard-debug-apks
          path: apks

      - name: Boot emulator and smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: |
            ls -la apks/
            APK=$(ls apks/*.apk 2>/dev/null | grep -i "x86_64" | head -n 1); if [ -z "$APK" ]; then APK=$(ls apks/*.apk 2>/dev/null | head -n 1); fi; echo "Installing $APK"; adb install "$APK"
            adb shell am start -n com.myboard.ime.debug/.ui.main.MainActivity
            sleep 90
            adb exec-out screencap -p > screen-main.png
            adb logcat -d > logcat.txt
            echo "===== CRASH SCAN ====="; grep -i -A 30 "FATAL EXCEPTION" logcat.txt | head -n 120 || true; echo "===== END SCAN ====="

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MyBoard-smoke-test
          path: |
            screen-main.png
            logcat.txt
